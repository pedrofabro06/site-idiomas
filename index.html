<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poliglota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bolhas" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="topo">
    <div class="marca" id="marca">🌍 Poliglota</div>
    <div class="status">
      <span id="streak-box" title="Dias seguidos estudando">🔥 <b id="streak">0</b></span>
      <span id="xp-box" title="Pontos de experiência">⭐ <b id="xp">0</b></span>
    </div>
  </header>

  <main id="app"></main>

  <footer class="rodape">Seu progresso fica salvo neste navegador. Dica: use as teclas 1 a 4 para responder.</footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
